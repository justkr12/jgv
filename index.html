<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JGVRP 채용 결과 시스템</title>

<style>
:root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --blue: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family:
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;
    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #f8fafc 45%,
            #eef2ff
        );
    color: var(--text);
}

.container {
    width: calc(100% - 32px);
    max-width: 470px;
    background: var(--card);
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    padding: 38px;
    box-shadow:
        0 20px 50px rgba(15, 23, 42, 0.08);
}

.logo {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    border-radius: 14px;
    background: #eff6ff;
    color: var(--blue);
    font-size: 24px;
    font-weight: 800;
}

h1 {
    margin: 0;
    text-align: center;
    font-size: 23px;
}

.subtitle {
    margin: 9px 0 28px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
}

.search {
    display: flex;
    gap: 9px;
}

input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

button {
    border: 0;
    border-radius: 10px;
    padding: 0 19px;
    background: var(--blue);
    color: white;
    font-weight: 700;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#result {
    margin-top: 20px;
}

.result {
    padding: 18px;
    border-radius: 12px;
}

.pass {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
}

.fail {
    background: #fef2f2;
    border: 1px solid #fecaca;
}

.result-title {
    font-weight: 800;
    margin-bottom: 13px;
}

.pass .result-title {
    color: var(--green);
}

.fail .result-title {
    color: var(--red);
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(148,163,184,.2);
    font-size: 14px;
}

.row:last-child {
    border-bottom: 0;
}

.label {
    color: var(--muted);
}

.footer {
    margin-top: 25px;
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
}

.admin-button {
    margin-top: 14px;
    width: 100%;
    background: #f8fafc;
    color: #64748b;
    border: 1px solid #e2e8f0;
    padding: 10px;
}

.admin-button:hover {
    background: #f1f5f9;
    color: #334155;
}

.modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(15, 23, 42, .45);
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 360px;
    background: white;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 25px 70px rgba(0,0,0,.2);
}

.modal-box h2 {
    margin-top: 0;
    font-size: 19px;
}

.modal-box button {
    width: 100%;
    height: 45px;
    margin-top: 10px;
}

.cancel {
    background: #e2e8f0 !important;
    color: #334155 !important;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">J</div>

    <h1>JGVRP 채용 결과</h1>

    <div class="subtitle">
        카톡 또는 디스코드 닉네임을 입력해주세요.
    </div>

    <div class="search">
        <input
            id="nickname"
            type="text"
            placeholder="닉네임 입력"
            autocomplete="off"
        >

        <button onclick="searchApplicant()">
            조회
        </button>
    </div>

    <div id="result"></div>

    <button
        class="admin-button"
        onclick="openAdminLogin()"
    >
        관리자
    </button>

    <div class="footer">
        JGVRP Recruitment System
    </div>
</div>

<div class="modal" id="adminModal">
    <div class="modal-box">

        <h2>관리자 로그인</h2>

        <p style="color:#64748b;font-size:13px;">
            관리자 비밀번호를 입력하세요.
        </p>

        <input
            id="adminPassword"
            type="password"
            placeholder="관리자 비밀번호"
            autocomplete="current-password"
        >

        <button onclick="adminLogin()">
            로그인
        </button>

        <button
            class="cancel"
            onclick="closeAdminLogin()"
        >
            취소
        </button>

    </div>
</div>

<script>
const nicknameInput =
    document.getElementById("nickname");

nicknameInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        searchApplicant();
    }
});

async function searchApplicant() {
    const nickname =
        nicknameInput.value.trim();

    const result =
        document.getElementById("result");

    if (!nickname) {
        result.textContent =
            "닉네임을 입력해주세요.";
        return;
    }

    result.textContent = "조회 중...";

    try {
        const response = await fetch(
            `/api/applicant?nickname=${encodeURIComponent(nickname)}`
        );

        const data = await response.json();

        if (data.found) {
            result.innerHTML = `
                <div class="result pass">
                    <div class="result-title">
                        🎉 채용에 합격하셨습니다.
                    </div>

                    <div class="row">
                        <span class="label">닉네임</span>
                        <strong>${escapeHTML(data.nickname)}</strong>
                    </div>

                    <div class="row">
                        <span class="label">배정 포지션</span>
                        <strong>${escapeHTML(data.role)}</strong>
                    </div>
                </div>
            `;
        } else {
            result.innerHTML = `
                <div class="result fail">
                    <div class="result-title">
                        ❌ 불합격 또는 미등록
                    </div>

                    <div style="font-size:14px;color:#64748b;">
                        입력하신 닉네임은 합격자 명단에
                        존재하지 않습니다.
                    </div>
                </div>
            `;
        }

    } catch (error) {
        result.textContent =
            "서버 연결에 실패했습니다.";
    }
}

function openAdminLogin() {
    document
        .getElementById("adminModal")
        .classList.add("show");

    document
        .getElementById("adminPassword")
        .focus();
}

function closeAdminLogin() {
    document
        .getElementById("adminModal")
        .classList.remove("show");
}

async function adminLogin() {
    const password =
        document
            .getElementById("adminPassword")
            .value;

    if (!password) {
        alert("비밀번호를 입력해주세요.");
        return;
    }

    try {
        const response = await fetch(
            "/api/admin/login",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    password
                })
            }
        );

        const data =
            await response.json();

        if (!response.ok) {
            alert(data.message);
            return;
        }

        // 관리자 토큰은 관리자 탭에서만 사용
        sessionStorage.setItem(
            "adminToken",
            data.token
        );

        // 새 탭으로 관리자 페이지
        window.open(
            "/admin",
            "_blank",
            "noopener,noreferrer"
        );

        closeAdminLogin();

    } catch {
        alert("서버 연결에 실패했습니다.");
    }
}

function escapeHTML(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
