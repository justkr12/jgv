<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JGVRP 채용 결과 시스템</title>
    <style>
        :root {
            --card-bg: rgba(30, 41, 59, 0.9);
            --text-color: #f8fafc;
            --accent-pass: #22c55e;
            --accent-fail: #ef4444;
            --primary: #3b82f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            backdrop-filter: blur(8px);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #93c5fd;
        }
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        input, select {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #475569;
            background-color: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }
        button {
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 0.5rem;
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        #result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 0.5rem;
            background-color: rgba(15, 23, 42, 0.9);
            display: none;
            text-align: left;
            animation: fadeIn 0.5s ease;
        }
        .congrats {
            color: var(--accent-pass);
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1.2rem;
            padding: 1rem;
            background: rgba(34, 197, 94, 0.1);
            border-radius: 0.5rem;
            border: 1px solid var(--accent-pass);
            word-break: keep-all;
        }
        .fail-box {
            color: var(--accent-fail);
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1rem;
            padding: 1rem;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 0.5rem;
            border: 1px solid var(--accent-fail);
        }
        .info-row { 
            margin-bottom: 0.6rem; 
            font-size: 0.95rem; 
            color: #cbd5e1;
        }
        .info-row strong {
            color: #fff;
        }
        /* 관리자 모달 스타일 */
        #admin-modal, #add-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            padding: 2rem;
            border-radius: 0.75rem;
            border: 1px solid #475569;
            text-align: center;
            width: 320px;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            margin-bottom: 1rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>JGVRP 채용 결과 시스템</h1>
    <div class="input-group">
        <input type="text" id="nickname" placeholder="카톡/디코 닉네임 입력" onkeypress="if(event.keyCode==13) handleSearchClick()">
        <button id="search-btn" onclick="handleSearchClick()">조회</button>
    </div>
    <div id="result-box"></div>
</div>

<!-- 관리자 인증 모달창 -->
<div id="admin-modal">
    <div class="modal-content">
        <h3>관리자 인증</h3>
        <input type="password" id="admin-pw" placeholder="비밀번호 입력" onkeypress="if(event.keyCode==13) verifyAdmin()">
        <button onclick="verifyAdmin()">확인</button>
        <button onclick="closeModal('admin-modal')" style="background-color: #475569; margin-top: 0.5rem;">취소</button>
    </div>
</div>

<!-- 합격자 추가 모달창 -->
<div id="add-modal">
    <div class="modal-content">
        <h3>합격자 추가 관리</h3>
        <input type="text" id="add-nickname" placeholder="닉네임 입력">
        <input type="text" id="add-role" placeholder="포지션 입력 (예: WSP)">
        <button onclick="saveApplicant()">추가 / 수정</button>
        <button onclick="closeModal('add-modal')" style="background-color: #475569; margin-top: 0.5rem;">닫기</button>
    </div>
</div>

<script>
    let applicants = {
        "yiopcnh": { role: "오프너" },
        "roo_1332": { role: "오프너 (수석)" },
        "han_vvvv": { role: "WSP" }
    };

    let searchClickCount = 0;
    let clickTimer = null;

    function handleSearchClick() {
        checkResult();

        // 조회 버튼 4번 연속 클릭 감지 로직
        searchClickCount++;
        clearTimeout(clickTimer);

        if (searchClickCount >= 4) {
            searchClickCount = 0;
            openModal('admin-modal');
        } else {
            clickTimer = setTimeout(() => {
                searchClickCount = 0;
            }, 1000);
        }
    }

    function checkResult() {
        const inputVal = document.getElementById("nickname").value.trim().toLowerCase();
        const resultBox = document.getElementById("result-box");
        
        if (!inputVal) return;
        
        resultBox.style.display = "block";

        let foundKey = Object.keys(applicants).find(k => k.toLowerCase() === inputVal);

        if (foundKey) {
            let data = applicants[foundKey];
            resultBox.innerHTML = `
                <div class="congrats">🎉 축하 합니다. JGVRP 채용에 합격하셨습니다.</div>
                <div class="info-row"><strong>닉네임:</strong> ${foundKey}</div>
                <div class="info-row"><strong>배정 포지션:</strong> ${data.role}</div>
            `;
        } else {
            resultBox.innerHTML = `
                <div class="fail-box">❌ 불합격 또는 미등록</div>
                <div class="info-row" style="text-align:center;">입력하신 닉네임은 합격자 명단에 존재하지 않습니다.<br>정확한 닉네임을 다시 확인해 주세요.</div>
            `;
        }
    }

    function openModal(modalId) {
        document.getElementById(modalId).style.display = "flex";
        if(modalId === 'admin-modal') {
            document.getElementById("admin-pw").value = "";
            document.getElementById("admin-pw").focus();
        }
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = "none";
    }

    function verifyAdmin() {
        const pw = document.getElementById("admin-pw").value;
        if (pw === "203846jko") {
            closeModal('admin-modal');
            openModal('add-modal');
        } else {
            alert("비밀번호가 틀렸습니다.");
        }
    }

    function saveApplicant() {
        const nick = document.getElementById("add-nickname").value.trim();
        const role = document.getElementById("add-role").value.trim();

        if (!nick || !role) {
            alert("닉네임과 포지션을 모두 입력해주세요.");
            return;
        }

        applicants[nick] = { role: role };
        alert(`[${nick}] 합격자 정보가 성공적으로 등록/수정되었습니다.`);
        closeModal('add-modal');
        document.getElementById("add-nickname").value = "";
        document.getElementById("add-role").value = "";
    }
</script>

</body>
</html>
